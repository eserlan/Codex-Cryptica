name: Coverage Deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Deploy workflow run containing the build artifact
        required: true
        type: string
      source_sha:
        description: Commit SHA used by the deploy workflow
        required: true
        type: string
      source_branch:
        description: Branch being covered
        required: true
        default: staging
        type: string

concurrency:
  group: coverage-deploy-${{ inputs.source_branch }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write

jobs:
  coverage-deploy:
    name: Coverage Deploy
    if: inputs.source_branch == 'staging'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Select coverage workspaces
        id: select
        run: bun scripts/affected-workspaces.mjs --full

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Run Coverage Tests
        env:
          WORKSPACES: ${{ steps.select.outputs.test_coverage }}
        run: |
          for workspace in $WORKSPACES; do
            bun run --filter "$workspace" test:coverage
          done

      - name: Copy web coverage into staging
        run: |
          if [ -d "apps/web/coverage" ]; then
            cp -r apps/web/coverage dist/coverage
          fi

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ inputs.source_run_id }}
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

      - name: Update Staging Deployment with Coverage
        if: success()
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codex-cryptica --branch=staging

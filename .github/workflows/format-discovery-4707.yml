name: Format discovery review PR

on:
  push:
    branches:
      - feat/adventure-discovery-review-mobile

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Apply repository formatting
        run: |
          bunx prettier --write \
            apps/web/src/lib/components/oracle/adventure/AdventureProvisionalFacts.svelte \
            apps/web/src/lib/components/oracle/adventure/AdventureProvisionalFacts.test.ts \
            apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.svelte \
            apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/lib/components/oracle/adventure/
            git commit -m "🎨 style(adventure): format discovery review changes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Temporary Prettier Preview
on:
  pull_request:
    branches: [staging]
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Format and emit reviewable UTF-8 payload
        run: |
          bun install --frozen-lockfile
          bunx prettier --write apps/web/src/lib/services/adventure/temporal-world-context.ts apps/web/src/lib/services/adventure/adventure-context-service.ts
          node -e 'const fs=require("fs");for(const p of process.argv.slice(1)) console.log("FORMATTED_FILE|"+p+"|"+Buffer.from(fs.readFileSync(p)).toString("base64"))' apps/web/src/lib/services/adventure/temporal-world-context.ts apps/web/src/lib/services/adventure/adventure-context-service.ts

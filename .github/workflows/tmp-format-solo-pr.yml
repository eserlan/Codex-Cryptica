name: Temporary Format Solo Continuity PR
on:
  push:
    branches:
      - feat/solo-adventure-conversation-continuity
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format only files changed by Solo Adventure continuity
        run: |
          bunx prettier --write \
            apps/web/src/lib/cloud-bridge/oracle-bridge.ts \
            apps/web/src/lib/stores/oracle/adventure-dependencies.ts \
            apps/web/src/lib/stores/oracle/adventure-generation.svelte.ts \
            apps/web/src/lib/stores/oracle/adventure-runtime.ts \
            apps/web/src/lib/stores/oracle/tests/adventure-generation.test.ts \
            apps/web/src/lib/stores/oracle/tests/adventure-runtime.test.ts \
            apps/workers/oracle-proxy/src/llm/interaction-stream.test.ts \
            apps/workers/oracle-proxy/src/llm/interaction-stream.ts \
            packages/ai-engine/src/adventure-turn-generation.service.test.ts \
            packages/ai-engine/src/adventure-turn-generation.service.ts \
            packages/ai-engine/src/client-manager.test.ts \
            packages/ai-engine/src/client-manager.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- apps/web/src/lib/cloud-bridge/oracle-bridge.ts apps/web/src/lib/stores/oracle apps/workers/oracle-proxy/src/llm/interaction-stream.test.ts apps/workers/oracle-proxy/src/llm/interaction-stream.ts packages/ai-engine/src/adventure-turn-generation.service.test.ts packages/ai-engine/src/adventure-turn-generation.service.ts packages/ai-engine/src/client-manager.test.ts packages/ai-engine/src/client-manager.ts
            git commit -m '🎨 style(solo): apply repository Prettier formatting'
            git push origin HEAD:feat/solo-adventure-conversation-continuity
          fi

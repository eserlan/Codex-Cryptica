# Temporary branch-scoped formatting pass, removed before merge.
name: World Entry Format Pass
on:
  push:
    branches:
      - feat/4572-world-entry-opening
    paths:
      - .github/workflows/tmp-world-entry-format.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/4572-world-entry-opening
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier to PR sources
        run: |
          git diff --name-only -z origin/staging...HEAD -- '*.ts' '*.svelte' |
            xargs -0 -r bunx prettier --write
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(adventure): format world-entry implementation'
          git push origin HEAD:refs/heads/feat/4572-world-entry-opening

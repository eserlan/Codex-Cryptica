name: Nightly God File Analysis

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Watch threshold for single-responsibility review trigger (Constitution Principle XIV)"
        required: false
        default: "500"
      critical_threshold:
        description: "Critical threshold for urgent decomposition candidate"
        required: false
        default: "800"
      top_count:
        description: "Number of top largest files to rank in table"
        required: false
        default: "25"

concurrency:
  group: "god-file-analysis"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Evaluate God Files (Constitution XIV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Run God File Analysis
        run: |
          mkdir -p test-results
          bun scripts/god-file-analysis.ts \
            --threshold="${{ inputs.threshold || '500' }}" \
            --critical-threshold="${{ inputs.critical_threshold || '800' }}" \
            --top="${{ inputs.top_count || '25' }}" \
            --summary-file="test-results/god-files-summary.md" \
            --json-file="test-results/god-files-report.json"

      - name: Append to Step Summary
        if: always()
        run: |
          if [ -f test-results/god-files-summary.md ]; then
            cat test-results/god-files-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: god-file-analysis-${{ github.run_id }}
          path: |
            test-results/god-files-summary.md
            test-results/god-files-report.json
          retention-days: 30

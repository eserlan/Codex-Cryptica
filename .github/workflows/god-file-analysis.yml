name: Nightly God File Analysis

on:
  schedule:
    # Run at 03:00 UTC every day
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Watch threshold for single-responsibility review trigger (Constitution Principle XIV)"
        required: false
        default: "500"
      critical_threshold:
        description: "Critical threshold for urgent decomposition candidate"
        required: false
        default: "800"
      top_count:
        description: "Number of top largest files to rank in table"
        required: false
        default: "25"

concurrency:
  group: "god-file-analysis"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Evaluate God Files (Constitution XIV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Run God File Analysis
        run: |
          mkdir -p test-results
          bun scripts/god-file-analysis.ts \
            --threshold="${{ inputs.threshold || '500' }}" \
            --critical-threshold="${{ inputs.critical_threshold || '800' }}" \
            --top="${{ inputs.top_count || '25' }}" \
            --summary-file="test-results/god-files-summary.md" \
            --json-file="test-results/god-files-report.json"

      - name: Append to Step Summary
        if: always()
        run: |
          if [ -f test-results/god-files-summary.md ]; then
            cat test-results/god-files-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: god-file-analysis-${{ github.run_id }}
          path: |
            test-results/god-files-summary.md
            test-results/god-files-report.json
          retention-days: 30

      - name: Trigger dev-agents degodify
        if: success()
        env:
          DEGODIFY_WEBHOOK_URL: ${{ secrets.DEGODIFY_WEBHOOK_URL }}
          DEGODIFY_WEBHOOK_SECRET: ${{ secrets.DEGODIFY_WEBHOOK_SECRET }}
          REPORT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          test -n "$DEGODIFY_WEBHOOK_URL"
          test -n "$DEGODIFY_WEBHOOK_SECRET"
          candidate=$(jq -c '.topFiles[] | select(.isDataCatalog == false and .status != "STABLE")' test-results/god-files-report.json | head -n 1)
          test -n "$candidate"
          payload=$(jq -cn --arg repository "${{ github.repository }}" --arg sha "$REPORT_SHA" --arg run "$RUN_ID" --argjson candidate "$candidate" '{repository:$repository, analysisRunId:$run, commitSha:$sha, candidate:{path:$candidate.relativePath,totalLines:$candidate.totalLines,codeLines:$candidate.codeLines,type:$candidate.type,status:$candidate.status,isDataCatalog:$candidate.isDataCatalog}}')
          signature=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DEGODIFY_WEBHOOK_SECRET" -hex | sed 's/^.* //')
          curl --fail-with-body --retry 3 -X POST "$DEGODIFY_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$signature" \
            -H "X-GitHub-Delivery: degodify-$RUN_ID" \
            --data "$payload"

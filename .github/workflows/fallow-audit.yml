name: Fallow Audit

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".fallowrc.json"

concurrency:
  group: "fallow-audit-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Codebase Intelligence Audit (Fallow)
    runs-on: ubuntu-latest
    continue-on-error: true # Non-blocking PoC phase (#3167)
    timeout-minutes: 5
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Fallow Audit (Annotations)
        run: |
          bunx fallow audit --base origin/${{ github.base_ref }} --format github-annotations

      - name: Run Fallow Audit (Step Summary)
        if: always()
        run: |
          bunx fallow audit --base origin/${{ github.base_ref }} --format github-summary >> $GITHUB_STEP_SUMMARY

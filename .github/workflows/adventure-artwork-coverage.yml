name: Adventure Artwork Coverage

# Adventure Artwork coverage & catalogue reconciliation checks (#4848).
# Verifies that docs/ADVENTURE_ARTWORK_CATALOG.md, seedArtwork, ARTWORK_CUES,
# and validator diagnostics stay synchronized and no undocumented NPC role gaps
# are introduced.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "packages/adventure-artwork-engine/**"
      - "scripts/validate-adventure-artwork*"
      - "docs/ADVENTURE_ARTWORK_CATALOG.md"
      - "bun.lock"
      - ".github/workflows/adventure-artwork-coverage.yml"

concurrency:
  group: "adventure-artwork-coverage-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Adventure artwork catalogue & coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Adventure artwork engine tests (coverage & doc sync)
        run: bun run --filter @codex/adventure-artwork-engine test

      - name: Adventure artwork validator tests
        run: bun test scripts/validate-adventure-artwork.test.ts

      - name: Offline coverage report check
        run: bun scripts/validate-adventure-artwork.mjs --coverage

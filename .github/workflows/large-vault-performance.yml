name: Large Vault Performance Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"

concurrency:
  group: large-vault-performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  baseline:
    name: Production benchmark (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      PERFORMANCE_PORT: "4173"
      PERFORMANCE_EXTERNAL_SERVER: "1"
      PERFORMANCE_RESULTS_PATH: test-results/large-vault-results.v1.json
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Build production preview
        working-directory: apps/web
        run: bun run build

      - name: Run report-only benchmark
        working-directory: apps/web
        run: |
          bun run preview --host 127.0.0.1 --port "$PERFORMANCE_PORT" > preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          bunx playwright test --config=playwright.performance.config.ts

      - name: Write baseline summary
        if: ${{ always() && hashFiles('apps/web/test-results/large-vault-results.v1.json') != '' }}
        working-directory: apps/web
        run: bun tests/performance/large-vault-summary.ts test-results/large-vault-results.v1.json

      - name: Evaluate report-only budgets
        if: ${{ always() && hashFiles('apps/web/test-results/large-vault-results.v1.json') != '' }}
        working-directory: apps/web
        run: >
          bun tests/performance/large-vault-budget.ts
          test-results/large-vault-results.v1.json
          tests/performance/budgets/large-vault.v1.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: large-vault-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/tests/performance/budgets/large-vault.v1.json
            apps/web/preview.log
          retention-days: 30

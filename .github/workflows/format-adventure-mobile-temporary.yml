# Temporary formatting helper. Delete before merge; triggered only by this file.
name: Temporary Adventure Mobile Formatting
on:
  push:
    branches:
      - fix/adventure-mobile-play-surface
    paths:
      - .github/workflows/format-adventure-mobile-temporary.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adventure-mobile-play-surface
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format changed Svelte and test files
        run: bunx prettier --write apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.svelte apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.test.ts apps/web/src/lib/components/oracle/adventure/AdventureLiveTranscript.svelte apps/web/src/lib/components/oracle/adventure/AdventureLiveTranscript.test.ts apps/web/src/lib/components/oracle/adventure/AdventureStateSummary.svelte apps/web/src/lib/components/oracle/adventure/AdventureStateSummary.test.ts apps/web/src/lib/components/oracle/adventure/AdventureComposer.svelte apps/web/src/lib/components/oracle/adventure/AdventureNarrativeTurn.svelte apps/web/src/lib/components/oracle/adventure/AdventureSuggestedActions.svelte apps/web/src/lib/components/oracle/adventure/AdventurePlay.svelte apps/web/src/lib/components/oracle/adventure/AdventureManagementMenu.svelte
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.svelte apps/web/src/lib/components/oracle/adventure/AdventureFocusPlay.test.ts apps/web/src/lib/components/oracle/adventure/AdventureLiveTranscript.svelte apps/web/src/lib/components/oracle/adventure/AdventureLiveTranscript.test.ts apps/web/src/lib/components/oracle/adventure/AdventureStateSummary.svelte apps/web/src/lib/components/oracle/adventure/AdventureStateSummary.test.ts apps/web/src/lib/components/oracle/adventure/AdventureComposer.svelte apps/web/src/lib/components/oracle/adventure/AdventureNarrativeTurn.svelte apps/web/src/lib/components/oracle/adventure/AdventureSuggestedActions.svelte apps/web/src/lib/components/oracle/adventure/AdventurePlay.svelte apps/web/src/lib/components/oracle/adventure/AdventureManagementMenu.svelte
          if ! git diff --cached --quiet; then
            git commit -m "style(adventure): apply repository Prettier formatting"
            git push origin HEAD:fix/adventure-mobile-play-surface
          fi

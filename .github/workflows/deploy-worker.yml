name: Deploy Oracle Proxy Worker

# Deploy the Oracle Proxy Cloudflare Worker on push to main branch
# Only triggers when files in the worker directory change

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/workers/oracle-proxy/**'
      - '.github/workflows/deploy-worker.yml'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Prevent concurrent deployments
concurrency:
  group: deploy-oracle-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://oracle-proxy.espen-erlandsen.workers.dev
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Wrangler CLI
        run: npm install -g wrangler@latest

      - name: Verify Wrangler Installation
        run: wrangler --version
      
      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Optional override only. One Worker serves every environment, so the
          # CORS allowlist lives in DEFAULT_ALLOWED_ORIGINS (src/index.ts) and
          # every deploy is identical. Setting this per GitHub Environment is
          # what broke staging on 2026-08-11: the variable is authoritative
          # when present, so a production deploy cut staging off.
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          # Worker name from wrangler.toml
          WORKER_NAME: oracle-proxy
        working-directory: apps/workers/oracle-proxy
        run: |
          echo "Deploying worker to ${{ github.event.inputs.environment || 'production' }}..."
          if [ -n "${ALLOWED_ORIGINS:-}" ]; then
            echo "::warning::ALLOWED_ORIGINS is set for this environment and overrides"
            echo "::warning::DEFAULT_ALLOWED_ORIGINS for *all* environments this Worker serves."
            wrangler deploy \
              --commit-dirty=true \
              --var ALLOWED_ORIGINS:"$ALLOWED_ORIGINS"
          else
            wrangler deploy --commit-dirty=true
          fi
          echo "worker_url=https://oracle-proxy.espen-erlandsen.workers.dev" >> $GITHUB_OUTPUT
      
      - name: Verify Deployment
        run: |
          echo "Waiting 10 seconds for deployment to propagate..."
          sleep 10
          # Falls back to the primary production origin, which is always in
          # DEFAULT_ALLOWED_ORIGINS, so the check works with no override set.
          HEALTH_CHECK_ORIGIN="${ALLOWED_ORIGINS%%,*}"
          HEALTH_CHECK_ORIGIN="$(printf '%s' "$HEALTH_CHECK_ORIGIN" | xargs)"
          HEALTH_CHECK_ORIGIN="${HEALTH_CHECK_ORIGIN:-https://codexcryptica.com}"
          
          # Simple health check
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://oracle-proxy.espen-erlandsen.workers.dev \
            -H "Content-Type: application/json" \
            -H "Origin: $HEALTH_CHECK_ORIGIN" \
            -d '{"contents":[{"role":"user","parts":[{"text":"health check"}]}],"generationConfig":{}}')
          
          echo "Health check response code: $response"
          
          # Accept 200 (success), 400 (invalid body but worker responding), or 401 (auth error but worker responding)
          if [[ "$response" =~ ^(200|400|401)$ ]]; then
            echo "✅ Worker is responding correctly"
          else
            echo "❌ Worker health check failed with code: $response"
            exit 1
          fi
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Worker**: oracle-proxy" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://oracle-proxy.espen-erlandsen.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.triggering_actor }}" >> $GITHUB_STEP_SUMMARY

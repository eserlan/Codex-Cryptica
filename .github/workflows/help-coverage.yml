name: Help Coverage

# Contextual Help (Cif) coverage checks (#3615). Runs the help-engine tests,
# which include the surface audit: a navigation item, `(app)` route or Settings
# tab without a Help decision in docs/help-assistant-coverage.md fails here.
# It also builds the knowledge bundle, which validates every registry entry and
# Help article's metadata the same way the Worker deploy does.

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "packages/help-engine/**"
      - "apps/web/src/lib/content/help/**"
      - "apps/web/src/lib/components/layout/nav-items.ts"
      - "apps/web/src/lib/components/settings/SettingsModal.svelte"
      - "apps/web/src/routes/(app)/**"
      - "docs/help-assistant-coverage.md"
      - "bun.lock"
      - ".github/workflows/help-coverage.yml"

concurrency:
  group: "help-coverage-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Help registry, articles and surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Help engine tests (retrieval, registry, ledger, surface audit)
        run: bun run --cwd packages/help-engine test

      - name: Build the knowledge bundle (validates registry and article metadata)
        run: bun run --cwd packages/help-engine bundle

name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: "Staging workflow run ID to promote (leave blank for latest successful staging run)"
        required: false
        type: string

concurrency:
  group: "promote-to-prod"
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  find-staging-build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      commit_sha: ${{ steps.find.outputs.commit_sha }}
      commit_msg: ${{ steps.find.outputs.commit_msg }}
    steps:
      - name: Find latest successful staging run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SPECIFIC_RUN: ${{ inputs.staging_run_id }}
        run: |
          if [ -n "$SPECIFIC_RUN" ]; then
            RUN_ID="$SPECIFIC_RUN"
          else
            # Find the latest successful deploy on the staging branch.
            # Using --branch is more reliable than --commit on the tip SHA,
            # since CI-only commits (no app change) may not have a deploy run.
            RUN_ID=$(gh run list \
              --workflow "Deploy to Cloudflare Pages" \
              --branch staging \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi

          if [ -z "$RUN_ID" ]; then
            echo "Error: No successful staging deployment found to promote."
            exit 1
          fi

          COMMIT_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          COMMIT_MSG=$(gh run view "$RUN_ID" --json displayTitle --jq '.displayTitle')

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

          echo "Promoting staging run #$RUN_ID ($COMMIT_SHA): $COMMIT_MSG"

  promote:
    needs: find-staging-build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.find-staging-build.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download staging artifact
        uses: actions/download-artifact@v8
        with:
          name: staging-dist
          run-id: ${{ needs.find-staging-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codex-cryptica --branch=main

      # This promotes an artifact already built and tested on staging (#2952)
      # rather than rebuilding, so a smoke test here is the only check that
      # the production deploy itself came out healthy.
      - name: Smoke test production
        run: |
          sleep 10
          check() {
            local path="$1"
            local url="https://codexcryptica.com${path}"
            local code
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/smoke-body.html -w "%{http_code}" --retry 3 --retry-delay 5 --retry-connrefused "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code, expected 200"
              exit 1
            fi
            if ! grep -qi "Codex Cryptica" /tmp/smoke-body.html; then
              echo "::error::$url did not contain expected app shell content"
              exit 1
            fi
            echo "OK ($code): $url"
          }

          check "/"
          check "/answers/how-do-you-run-a-heist-in-a-tabletop-rpg"
          check "/generators/heist"

      - name: Notify Discord on Production Deploy
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.VITE_DISCORD_WEBHOOK_URL_PROD }}
        run: |
          # Use the existing script for the standard notification
          ./scripts/discord-deploy.sh "production" "$DISCORD_WEBHOOK_URL" "https://codexcryptica.com/"

          # Construct a simple one-line promotion summary
          RUN_ID="${{ needs.find-staging-build.outputs.run_id }}"
          ACTOR="${{ github.actor }}"
          SUMMARY="🔁 **Promotion Successful**: Staging run #$RUN_ID was promoted to production by $ACTOR."

          # Send the summary
          PAYLOAD=$(jq -nc --arg content "$SUMMARY" '{content: $content}')
          curl -s -H "Content-Type: application/json" -X POST --data-binary "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Trigger Release Communications Agent
        if: success()
        continue-on-error: true
        env:
          RELEASE_COMMS_SECRET: ${{ secrets.RELEASE_COMMS_SECRET }}
        run: |
          # Fire-and-forget: this evaluates whether the release is worth
          # announcing and only comments on issue #2906 with its findings.
          # It must never affect the outcome of this deploy job, hence
          # continue-on-error plus the fallback `|| echo` below.
          curl -fsS -m 10 -X POST https://pr-webhook.codexcryptica.com/release-comms \
            -H "X-Release-Comms-Secret: $RELEASE_COMMS_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"promoteRunId\": \"${{ github.run_id }}\"}" \
            || echo "release-comms trigger failed (non-blocking)"

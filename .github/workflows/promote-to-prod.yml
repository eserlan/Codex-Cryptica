name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: "Staging workflow run ID to promote (leave blank for latest successful staging run)"
        required: false
        type: string

concurrency:
  group: "promote-to-prod"
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  find-staging-build:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      commit_sha: ${{ steps.find.outputs.commit_sha }}
      commit_msg: ${{ steps.find.outputs.commit_msg }}
    steps:
      - name: Find the latest successful staging run
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SPECIFIC_RUN: ${{ inputs.staging_run_id }}
        run: |
          if [ -n "$SPECIFIC_RUN" ]; then
            RUN_ID="$SPECIFIC_RUN"
          else
            # Taking the first result of a "latest successful run" listing
            # with per_page=1 is unreliable: it once returned a month-old run
            # and promoted an old build (#3852). Take the newest of a full page
            # instead, then prove it really is the staging head.
            RUN=$(gh api \
              "repos/$GH_REPO/actions/workflows/deploy.yml/runs?branch=staging&status=success&event=push&per_page=100" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last // empty')
            RUN_ID=$(jq -r '.id // empty' <<<"$RUN")
            RUN_SHA=$(jq -r '.head_sha // empty' <<<"$RUN")

            if [ -z "$RUN_ID" ]; then
              echo "::error::No successful staging deployment found to promote."
              exit 1
            fi

            # The run must build the staging head. The only commits allowed
            # after it are the post-promotion sync, which touches just the
            # version-bump files (and, being pushed by GITHUB_TOKEN, never
            # triggers a build of its own).
            HEAD_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/staging" --jq '.object.sha')
            if [ "$RUN_SHA" != "$HEAD_SHA" ]; then
              STATUS=$(gh api "repos/$GH_REPO/compare/$RUN_SHA...$HEAD_SHA" --jq '.status')
              EXTRA=$(gh api "repos/$GH_REPO/compare/$RUN_SHA...$HEAD_SHA" \
                --jq '[.files[].filename] - ["apps/web/package.json","apps/web/src/lib/config/index.ts","apps/web/src/service-worker.ts"] | .[]')
              if [ "$STATUS" != "ahead" ] || [ -n "$EXTRA" ]; then
                echo "::error::The newest successful staging run ($RUN_SHA) is not the staging head ($HEAD_SHA); staging has unbuilt changes. Wait for the staging deploy to succeed, or pass staging_run_id to promote a specific run."
                exit 1
              fi
            fi
          fi

          COMMIT_SHA=$(gh run view "$RUN_ID" --json headSha --jq '.headSha')
          COMMIT_MSG=$(gh run view "$RUN_ID" --json displayTitle --jq '.displayTitle')

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

          echo "Promoting staging run #$RUN_ID ($COMMIT_SHA): $COMMIT_MSG"

  promote:
    needs: find-staging-build
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.find-staging-build.outputs.commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download staging artifact
        uses: actions/download-artifact@v8
        with:
          name: staging-dist
          run-id: ${{ needs.find-staging-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Deploy to Production
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=codex-cryptica --branch=main

      # This promotes an artifact already built and tested on staging (#2952)
      # rather than rebuilding, so a smoke test here is the only check that
      # the production deploy itself came out healthy.
      - name: Smoke test production
        run: |
          sleep 10
          check() {
            local path="$1"
            local url="https://codexcryptica.com${path}"
            local code
            code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/smoke-body.html -w "%{http_code}" --retry 3 --retry-delay 5 --retry-connrefused "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code, expected 200"
              exit 1
            fi
            if ! grep -qi "Codex Cryptica" /tmp/smoke-body.html; then
              echo "::error::$url did not contain expected app shell content"
              exit 1
            fi
            echo "OK ($code): $url"
          }

          check "/"
          check "/answers/how-do-you-run-a-heist-in-a-tabletop-rpg"
          check "/generators/heist"

      # The smoke test above only proves the site answers. This proves it is
      # serving the build that was promoted, not an older one (#3852).
      - name: Verify production serves the promoted build
        run: |
          EXPECTED=$(jq -r .version dist/_app/version.json)
          for attempt in 1 2 3 4 5 6; do
            LIVE=$(curl -sS -m 20 "https://codexcryptica.com/_app/version.json?cb=$RANDOM" | jq -r .version 2>/dev/null || true)
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Production serves build $LIVE"
              exit 0
            fi
            echo "Attempt $attempt: production serves '$LIVE', expected '$EXPECTED'"
            sleep 10
          done
          echo "::error::Production is not serving the promoted build (expected $EXPECTED, got $LIVE)"
          exit 1

      # merge-staging-to-main merges exactly this commit, not whatever staging
      # has moved on to since.
      - name: Record promoted commit
        run: echo "${{ needs.find-staging-build.outputs.commit_sha }}" > promoted-sha.txt

      - name: Upload promoted commit
        uses: actions/upload-artifact@v7
        with:
          name: promoted-sha
          path: promoted-sha.txt
          retention-days: 7

      - name: Notify Search Indexes (IndexNow)
        if: success()
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          bun scripts/notify-search-indexes.ts \
            --base-ref="origin/main" \
            --head-sha="${{ needs.find-staging-build.outputs.commit_sha }}" \
            --summary

      - name: Notify Discord on Production Deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.VITE_DISCORD_WEBHOOK_URL_PROD }}
        run: |
          # Use the existing script for the standard notification
          ./scripts/discord-deploy.sh "production" "$DISCORD_WEBHOOK_URL" "https://codexcryptica.com/"

          # Construct a simple one-line promotion summary
          RUN_ID="${{ needs.find-staging-build.outputs.run_id }}"
          ACTOR="${{ github.actor }}"
          SUMMARY="🔁 **Promotion Successful**: Staging run #$RUN_ID was promoted to production by $ACTOR."

          # Send the summary
          PAYLOAD=$(jq -nc --arg content "$SUMMARY" '{content: $content}')
          curl -s -H "Content-Type: application/json" -X POST --data-binary "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      - name: Trigger Release Communications Agent
        if: success()
        continue-on-error: true
        env:
          RELEASE_COMMS_SECRET: ${{ secrets.RELEASE_COMMS_SECRET }}
        run: |
          # Fire-and-forget: this evaluates whether the release is worth
          # announcing and only comments on issue #2906 with its findings.
          # It must never affect the outcome of this deploy job, hence
          # continue-on-error plus the fallback `|| echo` below.
          curl -fsS -m 10 -X POST https://pr-webhook.codexcryptica.com/release-comms \
            -H "X-Release-Comms-Secret: $RELEASE_COMMS_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"promoteRunId\": \"${{ github.run_id }}\"}" \
            || echo "release-comms trigger failed (non-blocking)"

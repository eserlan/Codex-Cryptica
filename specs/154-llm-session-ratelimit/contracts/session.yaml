openapi: 3.0.3
info:
  title: Oracle Proxy Session API
  version: 1.0.0
paths:
  /api/session:
    post:
      summary: Exchange a Turnstile token for a session capability token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - turnstileToken
              properties:
                turnstileToken:
                  type: string
                  description: The token generated by the Cloudflare Turnstile widget.
      responses:
        '200':
          description: Successfully issued session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: >-
                      The HMAC-signed session capability token. Sent back on
                      subsequent requests as `Authorization: Bearer <token>`.
                      Signed, not encrypted — the payload is readable by the
                      holder and carries nothing confidential.
                  expiresAt:
                    type: integer
                    description: Expiry as seconds since epoch, mirroring the signed payload.
        '403':
          description: Invalid Turnstile token
  /api/generate:
    post:
      summary: Generate LLM content (existing endpoint, updated requirement)
      security:
        - bearerAuth: []
      responses:
        '401':
          description: >-
            Missing, cryptographically invalid, or expired session capability
            token. `error.code` is one of SESSION_TOKEN_MISSING,
            SESSION_TOKEN_INVALID, SESSION_TOKEN_EXPIRED. On
            SESSION_TOKEN_EXPIRED the client re-runs the Turnstile handshake and
            replays the request exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            Rate limit exceeded. Enforced by native Cloudflare Rate Limiting
            bindings keyed by the token id: 5 requests / 10s (burst) and
            20 requests / 60s (sustained). The limiter is permissive and
            eventually consistent, so these caps are approximate thresholds
            rather than exact counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - SESSION_TOKEN_MISSING
                - SESSION_TOKEN_INVALID
                - SESSION_TOKEN_EXPIRED
                - RATE_LIMITED
            message:
              type: string

openapi: 3.0.3
info:
  title: Oracle Proxy Session API
  version: 1.0.0
paths:
  /api/session:
    post:
      summary: Exchange a Turnstile token for a session capability token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - turnstileToken
              properties:
                turnstileToken:
                  type: string
                  description: The token generated by the Cloudflare Turnstile widget.
      responses:
        '200':
          description: Successfully issued session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: The HMAC-signed session capability token.
        '403':
          description: Invalid Turnstile token
  /api/generate:
    post:
      summary: Generate LLM content (existing endpoint, updated requirement)
      security:
        - bearerAuth: []
      responses:
        '401':
          description: Missing or cryptographically invalid session capability token
        '429':
          description: Rate limit exceeded (more than 100 requests per 10 minutes)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

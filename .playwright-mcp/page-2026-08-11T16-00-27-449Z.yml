        - generic [ref=f35e83]:
          - article [ref=f35e84]:
            - heading "Does the D&D NPC generator require an account?" [level=3] [ref=f35e85]
            - paragraph [ref=f35e86]: No. Generate and copy NPC notes on this page without logging in. Save the draft directly into a browser-local Codex Cryptica vault — no sign-up required.
          - article [ref=f35e87]:
            - heading "What does the RPG NPC generator create?" [level=3] [ref=f35e88]
            - paragraph [ref=f35e89]: It generates a complete NPC with a name, ancestry, role, personality traits, a hidden secret, motivation, faction connection, and a table-ready GM hook — structured for immediate use.
          - article [ref=f35e90]:
            - heading "Can I use it outside D&D?" [level=3] [ref=f35e91]
            - paragraph [ref=f35e92]: Yes. The output works for D&D, Pathfinder, OSR games, cyberpunk, and any genre. The generator is system-agnostic.
          - article [ref=f35e93]:
            - heading "How does saving a generated NPC work?" [level=3] [ref=f35e94]
            - paragraph [ref=f35e95]: Clicking 'Save to Codex' stores the NPC draft in your browser's local storage. Open Codex Cryptica and it imports automatically as a Character entity, ready to link to factions, locations, and campaign notes.

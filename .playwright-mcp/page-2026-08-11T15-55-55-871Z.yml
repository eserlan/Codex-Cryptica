      - generic [ref=f17e147]:
        - heading "Alien Race Generator FAQ" [level=2] [ref=f17e148]
        - generic [ref=f17e149]:
          - article [ref=f17e150]:
            - heading "What does the alien race generator create?" [level=3] [ref=f17e151]
            - paragraph [ref=f17e152]: A campaign-ready alien species with a physical description, evolutionary origin, homeworld, biology and lifecycle, senses and communication, culture, technology, beliefs, relations with outsiders, internal factions, weaknesses, naming conventions, typical archetypes, and adventure hooks.
          - article [ref=f17e153]:
            - heading "How is this different from just describing an unusual-looking humanoid?" [level=3] [ref=f17e154]
            - paragraph [ref=f17e155]: "The generator is built around consequence: every major biological or environmental trait has to change something else about the species. A six-limbed species gets tools, architecture and social concepts that assume six limbs; a species that communicates chemically gets a different idea of privacy, deception and law. A trait that shows up in the biology section and nowhere else is treated as a failure."
          - article [ref=f17e156]:
            - heading "What is the difference between Grounded and Freeform mode?" [level=3] [ref=f17e157]
            - paragraph [ref=f17e158]: Grounded / Evolutionary keeps the species biologically plausible and clearly shaped by selection pressure from its environment. Freeform / Fantastic also allows exotic life — crystalline organisms, colonial swarm minds, plasma structures, and self-replicating machine lineages — while still requiring that strangeness to have consistent consequences.
          - article [ref=f17e159]:
            - heading "Can I build a species to fit a world I already have?" [level=3] [ref=f17e160]
            - paragraph [ref=f17e161]: Yes. Describe the world, system, or powers in the campaign context field and the species is built to fit it, keeping any names you introduce. Inside a Codex Cryptica vault, the in-app generator also grounds the species in your existing entities.
          - article [ref=f17e162]:
            - heading "Does it work without an account?" [level=3] [ref=f17e163]
            - paragraph [ref=f17e164]: Yes. Generate and copy alien species on this page without logging in. Save the draft directly into a browser-local Codex Cryptica vault — no sign-up required.

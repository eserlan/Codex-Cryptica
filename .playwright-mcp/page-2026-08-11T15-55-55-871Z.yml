        - generic [ref=f17e74]:
          - heading "Weaknesses & Constraints" [level=2] [ref=f17e75]
          - list [ref=f17e76]:
            - listitem [ref=f17e77]: The specialised forward limbs are structurally weak and break easily, and a hexapod who loses one is functionally maimed in a way their medicine has never solved.
            - listitem [ref=f17e78]: Standard gravity feels weightless and unsafe to them; they misjudge distances and drop things constantly on other worlds.
          - heading "Naming Conventions" [level=2] [ref=f17e79]
          - paragraph [ref=f17e80]: Names are tonal and lose most of their meaning when rendered in another species' script, which they find quietly insulting.
          - heading "Typical Archetypes" [level=2] [ref=f17e81]
          - list [ref=f17e82]:
            - listitem [ref=f17e83]:
              - strong [ref=f17e84]: The Intermediary
              - text: — one of the few who can work comfortably with outsiders, and quietly distrusted at home for it.
            - listitem [ref=f17e85]:
              - strong [ref=f17e86]: The Specialist
              - text: — trained into their people's speciality, structural engineering and load-bearing materials, and worth more abroad than at home.
            - listitem [ref=f17e87]:
              - strong [ref=f17e88]: The Unfitted
              - text: — born without the aptitude their people organise themselves around, and living proof that the pattern everyone treats as universal has exceptions.
          - heading "Adventure Hooks" [level=2] [ref=f17e89]
          - list [ref=f17e90]:
            - listitem [ref=f17e91]: A delegation of the Corvine Reach-Born needs an outsider to carry a message their own communication cannot safely encode.
            - listitem [ref=f17e92]: Something is exploiting a known weakness of theirs deliberately, and they cannot investigate it without admitting the weakness exists.
            - listitem [ref=f17e93]: Their two internal factions are both recruiting the party, and each is telling a partial truth about what the other intends.

              - article [ref=f17e44]:
                - generic [ref=f17e45]:
                  - heading "Overview" [level=2] [ref=f17e46]
                  - paragraph [ref=f17e47]: The Corvine Reach-Born are a hard sci-fi species with six limbs, the forward pair specialised for fine manipulation while four remain load-bearing, native to a dense world where everything weighs nearly twice what it should. Their disposition is consensus-seeking, they are organised as clan lineages, and they currently stand as first contact pending to their neighbours.
                  - heading "Evolutionary Origin" [level=2] [ref=f17e48]
                  - paragraph [ref=f17e49]: They evolved in a dense world where everything weighs nearly twice what it should, which selected for compact, heavily reinforced bodies and cautious movement. That pressure set the constraints they have lived inside ever since — though not everything about them follows from it.
                  - heading "Homeworld & Environment" [level=2] [ref=f17e50]
                  - paragraph [ref=f17e51]: Their homeworld is a dense world where everything weighs nearly twice what it should. Because of it, a fall is usually fatal at home, so recklessness never became a virtue in their culture the way it did elsewhere.
                  - heading "Biology & Lifecycle" [level=2] [ref=f17e52]
                  - paragraph [ref=f17e53]: Physically they have six limbs, the forward pair specialised for fine manipulation while four remain load-bearing. They live a life cycle passing through distinct bodily stages, each with different capabilities; an individual is not one person to them but a sequence, and their languages use different pronouns and often different names per stage.
                  - heading "Senses, Communication & Psychology" [level=2] [ref=f17e54]
                  - paragraph [ref=f17e55]: "They communicate by low-frequency calls that carry for tens of kilometres, which means no conversation among them is ever fully private, and they developed complex etiquette for pretending not to have heard. In practice, secrecy means distance rather than walls, so their conspirators travel rather than whisper, and their intelligence services are organised around geography. Temperamentally they are consensus-seeking: no decision feels legitimate to them until everyone affected has been heard, which makes them slow allies and immovable ones."
                  - heading "Culture & Social Structure" [level=2] [ref=f17e56]
                  - paragraph [ref=f17e57]: "They organise themselves as clan lineages. Authority attaches to a life stage rather than a person, so their leadership rotates biologically and cannot be seized — only waited for. Their body plan shows here too: they never evolved a concept of \"free hands\" — standing, carrying and working are simultaneous, and idleness reads to them as illness. Not all of it comes from their biology, though — an early and unusually good relationship with a passing trade power gave them a legal vocabulary they never developed themselves, and they still argue in a grammar borrowed from strangers."
                  - heading "Technology" [level=2] [ref=f17e58]
                  - paragraph [ref=f17e59]: "At a pre-industrial level, their engineering shows its origins plainly: tools are built for three-point grip and are near-unusable by two-handed species; doorways, ladders and seating are wide and low, and their written script runs in three parallel columns because three limbs can write at once. Their acknowledged speciality is structural engineering and load-bearing materials, which they export everywhere."
                  - heading "Beliefs & Worldview" [level=2] [ref=f17e60]
                  - paragraph [ref=f17e61]: A truth nobody has agreed to is treated as merely a proposal, which other species read as relativism and they consider basic honesty about how knowledge works. What another species would call faith, they treat as an accurate description of how the world has always behaved for them.
                  - heading "Relations with Outsiders" [level=2] [ref=f17e62]
                  - paragraph [ref=f17e63]: "They are currently first contact pending. The friction is rarely malice: nobody has yet worked out which of their signals are greetings and which are warnings, and both sides are being careful for different reasons."
                  - heading "Internal Factions & Conflicts" [level=2] [ref=f17e64]
                  - paragraph [ref=f17e65]: One faction holds that their structural engineering and load-bearing materials should be traded openly for standing among other species; another argues that dependence is exactly how a species like theirs gets absorbed. Neither side is wrong about the risk.

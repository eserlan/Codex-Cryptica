          - article [ref=f26e122]:
            - heading "Does the D&D NPC generator require an account?" [level=3] [ref=f26e123]
            - paragraph [ref=f26e124]: No. Generate and copy NPC notes on this page without logging in. Save the draft directly into a browser-local Codex Cryptica vault — no sign-up required.
          - article [ref=f26e125]:
            - heading "What does the RPG NPC generator create?" [level=3] [ref=f26e126]
            - paragraph [ref=f26e127]: It generates a complete NPC with a name, ancestry, role, personality traits, a hidden secret, motivation, faction connection, and a table-ready GM hook — structured for immediate use.
          - article [ref=f26e128]:
            - heading "Can I use it outside D&D?" [level=3] [ref=f26e129]
            - paragraph [ref=f26e130]: Yes. The output works for D&D, Pathfinder, OSR games, cyberpunk, and any genre. The generator is system-agnostic.
          - article [ref=f26e131]:
            - heading "How does saving a generated NPC work?" [level=3] [ref=f26e132]
            - paragraph [ref=f26e133]: Clicking 'Save to Codex' stores the NPC draft in your browser's local storage. Open Codex Cryptica and it imports automatically as a Character entity, ready to link to factions, locations, and campaign notes.

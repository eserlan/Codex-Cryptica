# Template for the PRIVATE triage repository (not this repository).
# Copy to .github/workflows/purge-old-reports.yml in the private repo.
#
# Deletes in-app reports older than 180 days (FR-024). It runs daily, so no
# report survives past 181 days. Deletion removes the issue; closing is not
# enough. The token is a maintainer credential with admin rights on this repo,
# stored as the secret FEEDBACK_PURGE_TOKEN. The intake token used by the
# worker is create-only and must never be given this permission.
name: Purge old reports

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        type: boolean
        default: true

permissions:
  issues: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FEEDBACK_PURGE_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run != 'false' }}
    steps:
      - name: Find and delete reports older than 180 days
        run: |
          cutoff=$(date -u -d '180 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json id,number,title,createdAt \
            --jq ".[] | select(.createdAt < \"$cutoff\") | select(.title | test(\"^\\\\[(Problem|Idea|Other)\\\\] CC-\")) | \"\(.id) \(.number) \(.title)\"" \
          | while read -r id number title; do
              if [ "$DRY_RUN" = "true" ]; then
                echo "Would delete #$number: $title"
              else
                gh api graphql -f query='mutation($id: ID!) { deleteIssue(input: { issueId: $id }) { clientMutationId } }' -f id="$id"
                echo "Deleted #$number: $title"
              fi
            done

# Oracle Proxy Worker Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "oracle-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
minify = false

# Account ID (optional - will prompt if not set)
# account_id = "your-account-id"

# Environment variables (non-sensitive)
[vars]
# Comma-separated list of allowed origins
# Leave empty to use defaults (codex-cryptica.com, staging, pages.dev)
# CI/CD should override this per environment via deploy-worker.yml.
ALLOWED_ORIGINS = ""
# Set to "true" in CI/CD environments that should accept branch preview URLs
# like https://feature.codex-cryptica.pages.dev.
ALLOW_CLOUDFLARE_PAGES_PREVIEW_ORIGINS = "false"

# Secrets (must be set via `wrangler secret put`)
# - GEMINI_API_KEY: Your Google Gemini API key
# - OPENAI_API_KEY: OpenAI API key, used by the OpenAI-compatible LLM adaptor
#   (src/llm/adaptors/openai-adaptor.ts) for GPT-5.6 Luna and any other
#   OpenAI-family models registered in src/llm/registry.ts
# - TURNSTILE_SECRET_KEY: Server-side secret for publish verification
# - SESSION_TOKEN_SECRET: HMAC signing secret for LLM session capability
#   tokens (src/session.ts). Until this is set the session guard fails open
#   and generation behaves exactly as before, so the worker can be deployed
#   ahead of the secret without an outage.
# - CODEX_AUTOMATION_KEY: Private credential (or comma-separated list of keys)
#   for trusted automation/agent workflows to mint automation session tokens
#   without solving Turnstile.

# Development configuration
[dev]
port = 8787
local_protocol = "http"

# Build configuration
[build]
command = ""  # No build step needed for TypeScript

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[ai]
binding = "AI"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "codex-cryptica-statics"
remote = true

[[ratelimits]]
name = "PUBLISH_CREATE_RATE_LIMITER"
namespace_id = "1351"

  [ratelimits.simple]
  limit = 5
  period = 60

# Writes require a valid writeToken, so this mainly bounds runaway clients.
# Image-heavy vaults can exceed 100 asset uploads on first publish.
[[ratelimits]]
name = "PUBLISH_WRITE_RATE_LIMITER"
namespace_id = "1352"

  [ratelimits.simple]
  limit = 300
  period = 60

# LLM generation limits, keyed by session capability token id.
#
# The binding only supports period = 10 or 60, and is a permissive,
# eventually-consistent limiter rather than an exact counter — so these are two
# native windows, not one long sliding window. Burst kills tight loops; the
# per-minute cap bounds sustained volume. Tune the limits freely; the periods
# are fixed by the platform.
[[ratelimits]]
name = "LLM_BURST_RATE_LIMITER"
namespace_id = "1353"

  [ratelimits.simple]
  limit = 5
  period = 10

[[ratelimits]]
name = "LLM_GENERATION_RATE_LIMITER"
namespace_id = "1354"

  [ratelimits.simple]
  limit = 20
  period = 60

# Dedicated rate limiter for trusted automation sessions.
# More generous than the public human limit, but protects against loops/runaways.
[[ratelimits]]
name = "LLM_AUTOMATION_RATE_LIMITER"
namespace_id = "1355"

  [ratelimits.simple]
  limit = 120
  period = 60

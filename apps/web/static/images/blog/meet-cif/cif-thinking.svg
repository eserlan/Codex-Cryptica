      </g>
      <g class="head">
        <path
          class="silhouette"
          d="M52 129 C48 102 66 66 90 33 C109 6 135 9 154 23 C178 37 192 45 211 56 C230 67 221 83 207 80 C210 73 208 67 192 68 C202 86 210 109 206 126 C193 146 167 151 133 151 C93 153 67 151 52 129Z"
        />

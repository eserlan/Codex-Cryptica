            rx="8"
            ry="15"
            transform="rotate(8 161 109)"
          />
        </g>
        <g class="eye eye-happy">
          <path class="eye-arc" d="M100 120 Q112 98 125 120" />
          <path class="eye-arc" d="M148 118 Q161 96 174 117" />
        </g>
        <g class="eye eye-think">
          <path
